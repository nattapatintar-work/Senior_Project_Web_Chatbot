<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F6F3EA">
  <title>FoodFridgeGreen — Chat and Seasoning</title>

  <!-- Anuphan is the design's Thai font. Noto Sans Thai / system Thai fonts are the fallback if the CDN is unreachable. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="page">
    <div class="frame" id="frame">

      <header class="top">
        <div class="tabs" role="group" aria-label="หน้าจอ">
          <button type="button" class="tab" id="tabChat" aria-pressed="true">Chat</button>
          <button type="button" class="tab tab-seas" id="tabSeas" aria-pressed="false">
            <span>Seasoning</span>
            <svg class="tab-lock" id="tabLock" viewBox="0 0 24 24" width="14" height="14" aria-label="ล็อกอยู่" hidden>
              <rect x="5" y="11" width="14" height="9" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path>
            </svg>
          </button>
        </div>
        <button type="button" class="icon-btn" id="newChat" aria-label="เริ่มแชทใหม่">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M12 20h8"></path><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"></path></svg>
        </button>
      </header>

      <!-- ============================ CHAT ============================ -->
      <section class="view" id="chatView">
        <div class="scroll" id="scroll" role="log" aria-live="polite" aria-relevant="additions">
          <div id="gate"></div>
          <div id="messages" class="messages"></div>
        </div>

        <div class="composer-wrap">
          <div class="toast" id="toast" role="status" hidden></div>
          <div class="composer" id="composer">
            <div class="atts" id="atts" hidden></div>
            <div class="composer-row">
              <button type="button" class="round-btn attach-btn" id="attachBtn" aria-label="แนบรูปวัตถุดิบ">
                <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
              </button>
              <input type="file" id="fileInput" accept="image/*" multiple hidden>
              <label for="fg-composer" class="sr-only">ข้อความถึงบอท</label>
              <input id="fg-composer" class="composer-input" type="text" autocomplete="off" enterkeyhint="send" maxlength="1000">
              <button type="button" class="round-btn send-btn" id="sendBtn" aria-label="ส่ง">
                <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 19V5"></path><path d="M6 11l6-6 6 6"></path></svg>
              </button>
            </div>
          </div>
        </div>
      </section>

      <!-- ========================= SEASONING ========================== -->
      <section class="view" id="seasoningView" hidden>
        <div class="scroll seas-scroll">
          <div class="lock-banner" id="lockBanner" hidden>
            <div class="lock-banner-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="18" height="18"><rect x="5" y="11" width="14" height="9" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>
            </div>
            <div class="lock-banner-text">
              <div class="lock-banner-title">ล็อกเครื่องปรุงแล้ว</div>
              <div class="lock-banner-sub">เริ่มแชทใหม่เพื่อแก้ไขรายการ</div>
            </div>
            <button type="button" class="pill-btn" id="lockNewChat">แชทใหม่</button>
          </div>

          <div class="seas-head">
            <h1>เครื่องปรุงในครัวของคุณ</h1>
            <div class="seas-sub" id="seasSub"></div>
          </div>

          <div class="tiles" id="tiles"></div>
        </div>

        <div class="seas-footer">
          <div class="seas-pending" id="seasPending" hidden>มีการเปลี่ยนแปลงที่ยังไม่ได้ยืนยัน</div>
          <div class="seas-error" id="seasError" role="alert" hidden></div>
          <button type="button" class="confirm-btn" id="confirmBtn"></button>
        </div>
      </section>

    </div>
  </div>

  <noscript><p style="padding:24px;font-family:sans-serif">ต้องเปิด JavaScript เพื่อใช้งานแชทนี้</p></noscript>

  <script src="js/config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/logic.js"></script>
  <script src="js/api.js"></script>
  <script src="js/images.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
